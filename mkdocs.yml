site_name: MMDC documentation
site_description: Documentation of the Markarian Multiwavelength Data Center (mmdc.am), its website and the astro-mmdc Python SDK
site_url: https://docs.mmdc.am/
repo_url: https://github.com/icranet/astro-mmdc
repo_name: icranet/astro-mmdc
edit_uri: edit/main/docs/
copyright: ICRANet MMDC Team. SDK licensed under BSD-3-Clause; MMDC data under CC BY 4.0.

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html

plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        MMDC (https://mmdc.am), the Markarian Multiwavelength Data Center, builds multiwavelength,
        multitemporal SEDs and light curves of blazars and of any sky position from radio to gamma rays,
        runs on-demand Swift UVOT/XRT analysis, and fits SSC, EIC and hadronic blazar emission models.
        It is used from the website or from Python with the astro-mmdc SDK (`pip install astro-mmdc`).

        Rules for programmatic clients (scripts, pipelines, AI agents):

        - Positions are ICRS right ascension and declination in degrees.
        - Resolve a name first: POST https://mmdc.am/api/autocomplete/ with {"query": "Mrk 421"}
          answers {"results": [{"name", "ra", "dec", "refcatalog"}]}; astropy's SkyCoord.from_name also works.
        - Identify yourself. The SDK sends User-Agent astro-mmdc/<version>; `MMDC(app="your-project")`
          adds an X-MMDC-Client header. Raw HTTP must send X-MMDC-Client, otherwise the modeling POSTs
          answer HTTP 426.
        - An SED request reuses any job within 2 arcsec; do not send `refresh` routinely.
        - Respect Retry-After, keep at most 2 jobs in flight, and wait with the header `Prefer: wait=25`
          (the server maximum) instead of polling in a tight loop.
        - Undated catalogue values carry MJD 50000 (`undated` true); they are not 1995 observations.
        - Cite Sahakyan et al. 2024, AJ, 168, 289 (doi:10.3847/1538-3881/ad8231). MMDC data are
          licensed under CC BY 4.0 and require attribution.

        Recipes (Python SDK, `client = MMDC(app="your-project")`):

        - SED: `client.sed.get(ra=..., dec=..., name=...)`, then `.between(mjd_start, mjd_end)` and `.to_csv(path)`
        - Light curve: `client.observations.cone_search(ra=..., dec=..., radius_arcsec=10, is_lightcurve=True)`
        - Model curve: `client.modeling.infer(z=..., ebl=True, model_type="SSC", parameters={...})`
        - Fit: `client.modeling.submit_batch(csv, z=..., ebl=True, model_type="SSC")`, then `client.modeling.wait_for_batch(id)`
        - Swift: `client.madam.analyze(ra=..., dec=..., mjd_start=..., mjd_end=..., instrument="uvot")`

        The full guide for scripts and agents, with raw HTTP examples and limits, is the first page below.
      sections:
        Agents and scripts:
          - agents.md
        Python SDK:
          - getting-started.md
          - guides/*.md
          - api.md
        Website:
          - web/*.md
        Citing:
          - citing.md

extra:
  analytics:
    provider: google
    property: G-36HEV1M716
  social:
    - icon: material/web
      link: https://mmdc.am
      name: MMDC at mmdc.am
    - icon: fontawesome/brands/github
      link: https://github.com/icranet/astro-mmdc
      name: astro-mmdc on GitHub

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Using the website:
      - Getting SED data: web/sed-data.md
      - Blazar SED modeling: web/modeling.md
      - Fitting your SED: web/fitting.md
  - Python SDK:
      - Getting started: getting-started.md
      - Scripts and AI agents: agents.md
      - SED data: guides/sed.md
      - Observations: guides/observations.md
      - Swift UVOT/XRT analysis: guides/swift.md
      - Blazar emission modeling: guides/modeling.md
      - Results & errors: guides/results-errors.md
      - Advanced: guides/advanced.md
      - API reference: api.md
  - Citing: citing.md
  - Changelog: changelog.md
  - Open mmdc.am ↗: https://mmdc.am
