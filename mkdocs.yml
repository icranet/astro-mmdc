site_name: MMDC documentation
site_description: Documentation of the Markarian Multiwavelength Data Center (mmdc.am), its website and the astro-mmdc Python SDK
site_url: https://docs.mmdc.am/
repo_url: https://github.com/icranet/astro-mmdc
repo_name: icranet/astro-mmdc
edit_uri: edit/main/docs/
copyright: ICRANet MMDC Team. SDK licensed under BSD-3-Clause; MMDC data under CC BY 4.0.

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html

plugins:
  - search

extra:
  analytics:
    provider: google
    property: G-36HEV1M716
  social:
    - icon: material/web
      link: https://mmdc.am
      name: MMDC at mmdc.am
    - icon: fontawesome/brands/github
      link: https://github.com/icranet/astro-mmdc
      name: astro-mmdc on GitHub

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Using the website:
      - Getting SED data: web/sed-data.md
      - Blazar SED modeling: web/modeling.md
      - Fitting your SED: web/fitting.md
  - Python SDK:
      - Getting started: getting-started.md
      - SED data: guides/sed.md
      - Observations: guides/observations.md
      - Swift UVOT/XRT analysis: guides/swift.md
      - Blazar emission modeling: guides/modeling.md
      - Results & errors: guides/results-errors.md
      - Advanced: guides/advanced.md
      - API reference: api.md
  - Citing: citing.md
  - Changelog: changelog.md
  - Open mmdc.am ↗: https://mmdc.am
