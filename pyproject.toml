[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "astro-mmdc"
version = "0.2.11"
description = "Python SDK for the MMDC astrophysics platform — SED data access, on-demand Swift UVOT/XRT analysis and blazar broadband emission modeling"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Vazgen Vardanyan" },
    { name = "Narek Sahakyan" },
]
maintainers = [
    { name = "ICRANet MMDC Team" },
]
keywords = [
    "astrophysics",
    "blazar",
    "SED",
    "spectral-energy-distribution",
    "modeling",
    "astronomy",
    "swift",
    "uvot",
    "mmdc",
    "icranet",
    "multiwavelength",
    "light-curve",
    "xrt",
    "fermi",
    "astropy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.5",
    "pandas>=1.3",
]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "matplotlib>=3.5",
    "pandas>=1.3",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://mmdc.am"
Documentation = "https://docs.mmdc.am"
Paper = "https://doi.org/10.3847/1538-3881/ad8231"
Contact = "https://mmdc.am/#contact"
Source = "https://github.com/icranet/astro-mmdc"
Issues = "https://github.com/icranet/astro-mmdc/issues"
Changelog = "https://github.com/icranet/astro-mmdc/releases"

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE", "CITATION.cff", ".zenodo.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/astro_mmdc"]
